[project]
name = "signal-light"
version = "0.2.0"
description = "Status light for AI coding agents — macOS menu bar app."
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "ai-agent",
    "codex",
    "claude-code",
    "status-light",
    "macos",
    "menu-bar",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: MacOS",
]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
signal-light = "signal_light.cli:main"
codex-signal-hook = "signal_light.hooks.codex:main"
claude-code-signal-hook = "signal_light.hooks.claude_code:main"

[project.urls]
Homepage = "https://github.com/starlight36/vibecoding-signal-light"
Repository = "https://github.com/starlight36/vibecoding-signal-light"
Issues = "https://github.com/starlight36/vibecoding-signal-light/issues"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["signal_light*"]
exclude = ["SignalLightApp*", "tests*", "scripts*", "docs*"]
